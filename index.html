*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;background:#1b1c1f}
body{padding:14px 8px 34px}
.page{width:100%;max-width:780px;margin:auto;background:#fff;padding:16px 12px 30px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.title{height:64px;margin:0 0 18px;padding:0 18px;display:flex;align-items:center;color:#fff;font-size:31px;font-weight:900;letter-spacing:2px;background:linear-gradient(#1818b1,#08089a);border-radius:3px;box-shadow:inset 0 1px rgba(255,255,255,.35)}
.title.skku{margin-top:30px;background:linear-gradient(#155fb5,#0a438c)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px 14px}
.btn{position:relative;min-height:86px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 6px;color:#050505;text-decoration:none;font-size:24px;font-weight:900;line-height:1.18;word-break:keep-all;border-radius:23px;border:2px solid rgba(100,75,80,.45);background:linear-gradient(180deg,#f8dce2 0%,#f1c2cb 38%,#df9da9 100%);box-shadow:inset 0 4px 5px rgba(255,255,255,.95),inset 0 -7px 8px rgba(100,45,55,.18),0 5px 0 #b97984,0 7px 10px rgba(0,0,0,.22);transition:transform .1s,box-shadow .1s,filter .1s}
.btn:before{content:"";position:absolute;left:9%;right:9%;top:7px;height:22%;border-radius:50%;background:rgba(255,255,255,.42);filter:blur(2px)}
.btn span{position:relative;z-index:1}
.btn:active{transform:translateY(5px);box-shadow:inset 0 3px 4px rgba(255,255,255,.7),inset 0 -3px 5px rgba(80,40,50,.18),0 1px 0 #b97984,0 2px 5px rgba(0,0,0,.2);filter:brightness(.96)}
.green{background:linear-gradient(180deg,#e8f3d9 0%,#d7e9bc 38%,#b9d191 100%);border-color:rgba(100,115,65,.45);box-shadow:inset 0 4px 5px rgba(255,255,255,.95),inset 0 -7px 8px rgba(70,90,35,.16),0 5px 0 #98b171,0 7px 10px rgba(0,0,0,.22)}
.green:active{box-shadow:inset 0 3px 4px rgba(255,255,255,.7),inset 0 -3px 5px rgba(70,90,35,.18),0 1px 0 #98b171,0 2px 5px rgba(0,0,0,.2)}
.blue{background:linear-gradient(180deg,#dceafa 0%,#c5dbf5 38%,#9dbce4 100%);border-color:rgba(65,95,135,.45);box-shadow:inset 0 4px 5px rgba(255,255,255,.95),inset 0 -7px 8px rgba(55,80,120,.17),0 5px 0 #7e9fc9,0 7px 10px rgba(0,0,0,.22)}
.blue:active{box-shadow:inset 0 3px 4px rgba(255,255,255,.7),inset 0 -3px 5px rgba(55,80,120,.18),0 1px 0 #7e9fc9,0 2px 5px rgba(0,0,0,.2)}
.footer{text-align:center;color:#aaa;font-size:12px;margin-top:28px}
@media(max-width:600px){body{padding:8px 5px 24px}.page{padding:11px 8px 24px}.title{height:56px;margin-bottom:14px;padding:0 14px;font-size:27px}.title.skku{margin-top:25px}.grid{gap:13px 9px}.btn{min-height:72px;font-size:19px;border-radius:19px;box-shadow:inset 0 3px 4px rgba(255,255,255,.95),inset 0 -6px 7px rgba(0,0,0,.12),0 4px 0 #b97984,0 6px 8px rgba(0,0,0,.2)}}
@media(max-width:380px){.btn{font-size:17px;min-height:66px}.title{font-size:24px}}
</style>
